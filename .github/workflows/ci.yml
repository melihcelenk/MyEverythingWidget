name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build MyEverythingWidget.slnx -c Release

      # UI tests skip themselves outside Windows Sandbox (SandboxGuard); they run locally with scripts/test-ui.ps1.
      - name: Unit tests
        run: dotnet test --solution MyEverythingWidget.slnx -c Release --no-build
